[package]
name = "sqp-job-worker"
version.workspace = true
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
[dependencies]
optimization-job-api.workspace = true
# Not used by the worker: it puts the runner in the build graph, so that
# cargo build -p optimization-runner builds optimization-run in this repository.
optimization-runner.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqp-craft = { path = "../core" }
sqp-craft-solver = { path = "../sqp" }
sqp-craft-activeset = { path = "../activeset" }
sqp-craft-clarabel = { path = "../clarabel" }
