[package]
name = "sqp-craft-clarabel"
description = "Clarabel QP backend for the sqp-craft QP seam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/sqp-craft-clarabel"
homepage = "https://github.com/dietmarwo/SQP-craft"
keywords = ["optimization", "qp", "clarabel", "sqp", "solver"]
categories = ["mathematics", "science"]
publish = ["crates-io"]
[dependencies]
sqp-craft-parallel = { path = "../parallel", version = "0.16.0" }
sqp-craft = { path = "../core", version = "0.16.0" }
clarabel = "=0.11.1"
nalgebra = { version = "=0.33.2", default-features = false, features = ["std"] }
