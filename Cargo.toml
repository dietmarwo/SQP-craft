[workspace]
members = ["crates/optimization-job-api", "crates/optimization-runner", "crates/sqp-job-worker", "crates/core", "crates/python", "crates/clarabel", "crates/activeset", "crates/sqp", "crates/parallel"]
resolver = "3"

[workspace.package]
version = "0.16.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/dietmarwo/SQP-craft"
# Pre-release: names and signatures are provisional. Prevent accidental releases.
publish = false

[profile.release]
codegen-units = 1
