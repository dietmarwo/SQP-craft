[workspace]
members = ["crates/sqp-job-worker", "crates/core", "crates/python", "crates/clarabel", "crates/activeset", "crates/sqp", "crates/parallel"]
resolver = "3"

[workspace.package]
version = "0.17.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/dietmarwo/SQP-craft"
# Pre-release: names and signatures are provisional. Prevent accidental releases.
publish = false

[workspace.dependencies]
# The shared job API (envelope, result contract, worker SDK, runner) lives in
# github.com/dietmarwo/optimization-jobs; change the revision there first.
optimization-job-api = { git = "https://github.com/dietmarwo/optimization-jobs", rev = "602d31afacf8bd2ecb0b0e941d18bd8e2821c1e3" }
optimization-runner = { git = "https://github.com/dietmarwo/optimization-jobs", rev = "602d31afacf8bd2ecb0b0e941d18bd8e2821c1e3" }

[profile.release]
codegen-units = 1
