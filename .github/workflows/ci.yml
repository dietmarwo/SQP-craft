name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Debug build on purpose: integer overflow checks stay enabled.
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p sqp-craft --example toy
      - run: cargo run --locked -p sqp-craft-solver --example solve

  msrv:
    name: Rust 1.85 (declared rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    env:
      MATURIN_PEP517_ARGS: --locked
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - run: python examples/demo.py
      - run: python examples/solve_sqp.py
      - run: python examples/restore_hs071.py
      - run: python examples/orbit_transfer.py 20

  baseline:
    name: SLSQP comparison and stress test
    runs-on: ubuntu-latest
    env:
      MATURIN_PEP517_ARGS: --locked
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install ".[bench]"
      - run: python examples/compare_baseline.py --table >> "$GITHUB_STEP_SUMMARY"
      - run: python examples/compare_workspace.py --repeats 1 > workspace-results.json
      - name: Random feasible problems (fails on a false convergence claim)
        run: |
          for seed in 1 2 3 4; do
            python examples/stress_random.py --seed $seed --count 300 --table >> "$GITHUB_STEP_SUMMARY"
            python examples/stress_random.py --reuse-workspace --seed $seed --count 300 --table >> "$GITHUB_STEP_SUMMARY"
            python examples/stress_random.py --qp-solver active-set --seed $seed --count 300 --table >> "$GITHUB_STEP_SUMMARY"
            python examples/stress_random.py --qp-solver active-set --elastic --seed $seed --count 300 --table >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Complementarity problems (fails on a false convergence claim)
        run: |
          for seed in 1 2; do
            python examples/stress_mpcc.py --qp-solver active-set --seed $seed --count 300 --table >> "$GITHUB_STEP_SUMMARY"
            python examples/stress_mpcc.py --qp-solver active-set --elastic --seed $seed --count 300 --table >> "$GITHUB_STEP_SUMMARY"
          done

  dummy-only:
    name: Python build without the native solver
    runs-on: ubuntu-latest
    env:
      MATURIN_PEP517_ARGS: --locked --no-default-features
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q tests/test_contract.py
      - name: The missing method is an error, not a fallback
        shell: python
        run: |
          import pytest
          from sqp_craft import ProblemSpec, solve
          class M:
              def functions(self, x): return x[0] ** 2, []
              def derivatives(self, x): return [2 * x[0]], []
          spec = ProblemSpec(lower=[-1.0], upper=[1.0], constraint_lower=[],
                             constraint_upper=[], jacobian_indptr=[0], jacobian_indices=[])
          with pytest.raises(NotImplementedError, match="not compiled"):
              solve(spec, M(), [0.5], method="sqp")
          print("ok")
