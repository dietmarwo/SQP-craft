name: POUNCE curvature pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      MATURIN_PEP517_ARGS: --locked
      SQP_CRAFT_BENCH_CACHE: ${{ github.workspace }}/../bench-cache
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v5
        with:
          path: ${{ env.SQP_CRAFT_BENCH_CACHE }}
          key: s2mpj-${{ hashFiles('bench/s2mpj.py') }}
      - name: Install SQP-craft from source and the pinned benchmark wheel
        run: |
          python -m pip install ".[bench,test]" numpy==2.5.5 scipy==1.18.1
          python -m pip download -r docs/benchmarks/pounce-curvature/pounce-linux-x86_64.txt \
            --no-deps --only-binary=:all: --require-hashes --dest "$RUNNER_TEMP/wheels"
          wheel=("$RUNNER_TEMP"/wheels/pounce_solver*.whl)
          wheel_sha=$(sha256sum "${wheel[0]}")
          echo "SQP_CRAFT_POUNCE_WHEEL_SHA256=${wheel_sha%% *}" >> "$GITHUB_ENV"
          python -m pip install --no-deps "${wheel[0]}"
      - name: Fetch and check the fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/pounce-evidence"
          python -m bench.s2mpj fetch
          python -m bench.pounce_fixtures > "$RUNNER_TEMP/pounce-evidence/fixtures.json"
          python -m pytest -q tests/test_bench.py tests/test_bench_pounce.py
      - name: Replay the committed records on the original models
        run: |
          d=docs/benchmarks/pounce-curvature
          python -m bench.pounce_report "$d/primary.jsonl.gz" "$d/controls.jsonl.gz" "$d/fixtures.json" \
            --check --recheck | cmp - "$d/tables.md"
      - name: Compare curvature options
        run: |
          out="$RUNNER_TEMP/pounce-evidence"
          selection=docs/benchmarks/pounce-curvature/selection.json
          python -m bench.run "$selection" "$out/primary.jsonl" --evidence --jobs 2 \
            --solvers auto,pounce-sqp-exact,pounce-sqp-lbfgs
          python -m bench.run "$selection" "$out/controls.jsonl" --evidence --jobs 2 \
            --problems ROSENBR,HS44,HS71,DTOC2 --solvers pounce-sqp-damped,clarabel,clarabel+exact
          python -m bench.pounce_report "$out/primary.jsonl" "$out/controls.jsonl" "$out/fixtures.json" --check --recheck \
            > "$out/tables.md"
          cat "$out/tables.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pounce-curvature-evidence
          path: ${{ runner.temp }}/pounce-evidence
