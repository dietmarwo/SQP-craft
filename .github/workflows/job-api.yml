name: Shared job API

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The shared review tests and the tutorial validate against the JSON Schemas.
  JOB_API_REQUIRE_SCHEMA: "1"

jobs:
  native-jobs:
    name: Job layer (fmt, clippy, tests, integration, tutorial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: JSON Schema validator for the schema checks
        run: python3 -m pip install "jsonschema>=4.18,<5"
      - name: Format and lint job layer
        run: |
          cargo fmt -p optimization-job-api -p optimization-runner -p sqp-job-worker -- --check
          cargo clippy --locked -p optimization-job-api -p optimization-runner -p sqp-job-worker --all-targets -- -D warnings
      - name: Contract tests and native build
        run: |
          cargo test --release --locked -p optimization-job-api -p optimization-runner -p sqp-job-worker
          cargo build --release --locked -p optimization-runner -p sqp-job-worker
      - name: Lifecycle and numerical integration
        run: python3 scripts/job-api/test_integration.py
      - name: Shared runner regressions
        run: python3 scripts/job-api/test_review.py
      - name: Shared job API files match their manifest
        # Shared with fcmaes-rust and LP-IP-craft; change all three together.
        run: sha256sum -c docs/job-api/SHARED-SOURCES.sha256
      - name: Runnable tutorial
        run: python3 tutorials/job-api/run.py --root "$RUNNER_TEMP/job-api-tutorial"
  msrv:
    name: Rust 1.88 (job layer rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets -p optimization-job-api -p optimization-runner -p sqp-job-worker
