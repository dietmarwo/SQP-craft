name: Shared job API

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The shared review tests and the tutorial validate against the JSON Schemas.
  JOB_API_REQUIRE_SCHEMA: "1"

jobs:
  native-jobs:
    name: Job layer (fmt, clippy, tests, integration, tutorial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: JSON Schema validator for the schema checks
        run: python3 -m pip install "jsonschema>=4.18,<5"
      - name: Format and lint the worker
        run: |
          cargo fmt -p sqp-job-worker -- --check
          cargo clippy --locked -p sqp-job-worker --all-targets -- -D warnings
      - name: Worker tests and native build
        # The runner and the shared crates come from optimization-jobs at the
        # revision Cargo.toml pins; their own tests run there.
        run: |
          cargo test --release --locked -p sqp-job-worker
          cargo build --release --locked -p optimization-runner -p sqp-job-worker
      - name: Shared harness against this worker
        # The scripts come from Cargo's checkout of optimization-jobs.
        run: |
          SHARED=$(python3 scripts/job-api/shared_root.py)
          export JOB_API_TARGET="$PWD/target/release" JOB_API_TUTORIALS="$PWD/tutorials/job-api"
          python3 "$SHARED/scripts/job-api/test_integration.py"
          python3 "$SHARED/scripts/job-api/test_review.py"
      - name: Runnable tutorial
        run: python3 tutorials/job-api/run.py --root "$RUNNER_TEMP/job-api-tutorial"
  msrv:
    name: Rust 1.88 (job worker rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets -p sqp-job-worker
