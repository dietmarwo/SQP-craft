[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "sqp-craft"
version = "0.16.0"
description = "SQP solver in Rust (dense-BFGS pilot with Clarabel QPs) with Python bindings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "numpy>=1.24"]
bench = ["numpy>=1.24", "scipy>=1.15,<2"]

[project.urls]
Repository = "https://github.com/dietmarwo/SQP-craft"

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
python-source = "python"
module-name = "sqp_craft._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
