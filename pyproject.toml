[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "sqp-craft"
version = "0.17.0"
description = "SQP solver in Rust (dense-BFGS pilot with Clarabel QPs) with Python bindings"
readme = "python/README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["optimization", "nonlinear programming", "sequential quadratic programming", "SQP", "Rust"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "numpy>=1.24"]
bench = ["numpy>=1.24", "scipy>=1.15,<2"]

[project.urls]
Documentation = "https://github.com/dietmarwo/SQP-craft/blob/main/ai-context.md"
Issues = "https://github.com/dietmarwo/SQP-craft/issues"
Changelog = "https://github.com/dietmarwo/SQP-craft/blob/main/CHANGELOG.md"
"Optimization ecosystem" = "https://dietmarwo.github.io/optimization-jobs/"
"AI agent guide" = "https://github.com/dietmarwo/optimization-jobs/blob/main/ai-context.md"
Repository = "https://github.com/dietmarwo/SQP-craft"

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
python-source = "python"
module-name = "sqp_craft._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
